<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>松東營造2024年員工旅遊｜松東營造</title><meta name="description" content="松東營造松東營造2024年員工旅遊活動相簿，共5張照片。"><link rel="stylesheet" href="../../assets/css/subpage.css"><style>
.album-main { padding: 48px 0 64px; }
.album-main h1 { color: var(--navy); font-size: clamp(26px,4vw,38px); line-height: 1.4; margin-bottom: 8px; }
.album-date { color: var(--muted); margin-bottom: 28px; }
.album-photo { margin: 0; }
.album-photo img { display: block; width: 100%; height: min(65vh,720px); object-fit: contain; background: var(--dark); border-radius: 4px; }
.album-photo figcaption { margin-top: 12px; color: var(--muted); text-align: center; }
.album-controls { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: 24px; }
.album-controls[hidden] { display: none; }
.album-controls button { font: inherit; min-height: 48px; padding: 10px 22px; border: 1px solid var(--navy); border-radius: 4px; background: var(--navy); color: var(--paper); cursor: pointer; }
.album-controls button:hover { background: var(--dark); }
.album-controls button:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
.album-counter { color: var(--navy); min-width: 5ch; text-align: center; font-variant-numeric: tabular-nums; }
@media(max-width:600px) { .album-main { padding-block: 32px; } .album-photo img { height: auto; aspect-ratio: 4 / 3; } .album-controls { gap: 16px; } .album-controls button { padding-inline: 16px; } }
</style></head>
<body>  <header class="site-header">
    <nav class="container nav-wrap" aria-label="主要導覽">

      <a href="../../index.html" class="brand" aria-label="松東營造首頁">
        <img
          src="../../assets/images/brand/logo.png"
          alt=""
          width="62"
          height="50"
        >

        <span>
          <strong class="brand-name">松東營造</strong>
          <span class="brand-en">SONG DONG</span>
        </span>
      </a>

      <a href="../activities.html" class="back-link">
        ← 員工花絮
      </a>

    </nav>
  </header><main class="album-main"><div class="container"><h1>松東營造2024年員工旅遊</h1><p class="album-date">共5張照片</p><figure class="album-photo"><img id="album-image" src="../../assets/images/company/01.jpg" alt="松東營造2024年員工旅遊，第1張照片" width="1477" height="1108"><figcaption id="album-caption" aria-live="polite">第1張，共5張</figcaption></figure><div class="album-controls" hidden><button type="button" id="album-prev" aria-label="上一張照片">← 上一張</button><span class="album-counter" id="album-counter">1 / 5</span><button type="button" id="album-next" aria-label="下一張照片">下一張 →</button></div><noscript><p>相簿照片：<a href="../../assets/images/company/01.jpg">第1張</a>、<a href="../../assets/images/company/04.jpg">第2張</a>、<a href="../../assets/images/news/travel-08.jpg">第3張</a>、<a href="../../assets/images/news/travel-09.jpg">第4張</a>、<a href="../../assets/images/news/travel-10.jpg">第5張</a></p></noscript></div></main>  <footer class="footer">
    <div class="container footer-wrap">

      <div>
        <strong>松東營造股份有限公司</strong>
        <small>© 2026 SONG DONG. All rights reserved.</small>
      </div>

      <a href="../../index.html">返回首頁 →</a>

    </div>
  </footer>
<script>
(function () {
  'use strict';
  const photos = ["../../assets/images/company/01.jpg","../../assets/images/company/04.jpg","../../assets/images/news/travel-08.jpg","../../assets/images/news/travel-09.jpg","../../assets/images/news/travel-10.jpg"];
  const photo = document.getElementById('album-image');
  const caption = document.getElementById('album-caption');
  const counter = document.getElementById('album-counter');
  let current = 0;
  function movePhoto(step) {
    current = (current + step + photos.length) % photos.length;
    photo.src = photos[current];
    photo.alt = '松東營造2024年員工旅遊，第' + (current + 1) + '張照片';
    caption.textContent = '第' + (current + 1) + '張，共' + photos.length + '張';
    counter.textContent = (current + 1) + ' / ' + photos.length;
  }
  document.getElementById('album-prev').addEventListener('click', function () { movePhoto(-1); });
  document.getElementById('album-next').addEventListener('click', function () { movePhoto(1); });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      movePhoto(event.key === 'ArrowLeft' ? -1 : 1);
    }
  });
  document.querySelector('.album-controls').hidden = false;
})();
</script></body></html>
